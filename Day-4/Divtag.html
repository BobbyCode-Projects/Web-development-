<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Div it is block level tag / 100%width of the space -->
    <div style="background-color: orange;"> 
        <h2>Menu</h2>
        <ol>
            <li>Pizza</li>
            <li>Coke</li>
        </ol>

    </div>

    <div style="background-color: floralwhite;">
        <h2>Review</h2>
        <Strong>Good Restraunt</Strong>
        <p>_Bobby*****</p>
    </div>

    <!-- Span tag takes only required amount width / inline tag
    span tag can be added inside any other html tag -->

    <span style="background-color: brown;">Login</span>
    <button>Cart <span>0</span></button>
</body>
</html>
