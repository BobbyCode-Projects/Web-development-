    <script>
        //Arthimetic Operators - + , - , / , * , %

    var x = 10
    var y = 7

    console.log(x+y)
    console.log(x-y)
    console.log(x/y)
    console.log(x*y)
    console.log(x%y)

    //modulo
    console.log(10%5)   //reaminder - 0

    console.log(12%5)  //reaminder - 2
    
    //left number is smaller than right number is modulo is -   LEFT number
    console.log(2%9)  //2

    console.log(1%8) //1
    </script>
