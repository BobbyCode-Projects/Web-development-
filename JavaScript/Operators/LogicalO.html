<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // AND - && - IF BOTH CONDITION IS TRUE THEN OUTPUT TRUE

        var ismember = true
        let TotalPrice = 300

        console.log(ismember && TotalPrice > 200)



        // OR - || if only one condition is true then output is true

        console.log(ismember || TotalPrice > 500)

        //negation - | : Opposite Value

        let netflixsub = false
        console.log(!netflixsub)


        //Comparsion - Two Values

        const a = 10
        const b = "10"

        //== compare value - both value are same output is true

        console.log(a == b)   //True

        //=== comapare value and data types - both are same output is true

        console.log(a === b)  //False


    </script>
</body>
</html>
