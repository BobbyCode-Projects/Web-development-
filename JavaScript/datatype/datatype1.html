<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data Types in JavaScript</h1>

    <script>
        //Data Type - Types of Data

        //1.String = Text "Anything Inside double or single quotes" or ''
        var username = "bobby1234"
        console.log(username)
        //Check the data type of any value - typeof(varibalename)
        console.log(typeof(username)) 


        //2.Number : +ve , -ve , DecimalNumber   Everynumber is a number 
        //Write Number Directly
        var age = 21
        console.log(typeof(age))


        //3.Boolean - when the value is in true or false
        var issubscribed = false

        var isloggedin = "true"
        console.log(typeof(isloggedin))
        

        //4.Undefined - when no value is assigned
        var a
        console.log(typeof(a))


        //5.Null Nothing
        var b = null
        console.log(typeof(b))
    </script>
</body>
</html>
