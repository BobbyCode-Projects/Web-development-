    <script>


   //Array - it is used to store mulitiple data/value at the same time
   //Advantage in js Array - can of different data types together
   //symbol - [] square bracket
   
   //Rule : Index no starts with 0

    let students = [ "Abhinav" , "vaish" , "pyish" , "bobby" , "niharika"]
    console.log(students)

    //Access asingle data from array
    // arrayname[indexno]
     console.log(students[2])

    //products
    let products = ["Mobile" , "Laptop" , "TV" , "Fridge" , "Washing Machine" ]
    console.log(products)


    //objects - it is used to store mulitple data/value at the same time
    //collection of data
    //format : key(left):value(right) pair
    //symbol - {curly bracket}

    let employe1 = {

        //key:value 
        name:"Bhargav sai" ,
        email:"bobby@gmail.com" ,
        id:1234 ,
        salary:60000
    }

    //how to access the value i objects : objectName.keyname
    console.log(employe1.email)

      </script>
