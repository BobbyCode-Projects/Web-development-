            //alert('Eligible for Driving')     //pop up msg

        //2. if - else 
        // if - true and else - false 

        let age = 11
        if(age>=18) {
            //Body of IF
            console.log('Eligible')

            alert('Eligible for Driving')    //pop up msg

        }else{

            alert('Not eligible - Age should be above 18 or 18')
        }


        //else if - multiple condtion
        //Delivery charges - amount is greater or equal to 500- free
        //amount between 400-499 - 30rs delivery charge
        //amount between 300-399 - 50rs delivery charge
        //cannot place minimum cart value is 300

        let amount = 799.99

        if(amount >= 500){
            alert('FREE DELIVERY')

        }
        else if(amount>=400){

            alert('Rs 30 Delivery Charges')

        }
        else if(amount>=300){

            alert('Rs 50 Delivery Charges')

        }
        else{

            alert('Cannot place order - minimum cart value is 300')
        }
