<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Loop should be Ending everything
        // Task - Print numbers 1 to 10 in console

        console.log(1)
        console.log(2)
        console.log(3)
        console.log(4)
        console.log(5)
        // ......

        //for loop
        //for(starting point;ending/condition point;  Increment = ++ / Decrement = -- ) - keyword

        //Task print 1 to 10

        for(let i = 1; i<=10; i++ ){
            //Repeated Task
                console.log("the value of i " + i)
        }



        //while loop - Entry Controlled Loop
        //while(condition) - when condition is True loop start and when condition become false loop stopped

        let count = 1

        while(count<=5){
            console.log("Hii I am while Loop")
            count++
        }

        //Do while Loop - exit Controlled Loop
        //It will execute / run the code atleast 1 time - even tho condition is false
        let number = 7

        do{

                    console.log('Hello how are you?')

        }while(number<=5)
    </script>
</body>
</html>
