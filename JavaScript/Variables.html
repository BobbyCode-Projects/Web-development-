<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Variables - it is used to store the data
        //Trick - "Text Format Data" or ''
        //     number format data write directly

        //Keyword - var
        //Syntax variable variablename = value

        var username = "Bhargav"
        console.log(username)
        

        var age = 21
        console.log(age)

        //Disadvantage of var keyword - it allows using same variable name and updates the previous value

        var phoneno = 123456

        var phoneno = 654321
        console.log(phoneno)


        //2. Keyword - let 

        let email = "abc@gmail.com"
        console.log(email)
        // let email = "xyz@gmail.com" - throw error becoz using same variablename that is email along with let

        //Disadvantage - if you used the same variablename without using let keyword it will update the value
        let review = 4.5
        review = 2.5
        console.log(review)


        //3. Keyword - const means constant - fixed

        const abc = "hey guys"
        console.log(abc)



    </script>
</body>
</html>
