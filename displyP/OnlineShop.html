<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: cursive;
            background-color: #f8f8f8;
            margin: 0;
        }

        .parent{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 50px;
            padding: 10px;
        }

        .product{
            border: 1px solid black;
            overflow: hidden;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 6px black;
            padding-bottom: 15px;
            background-color: white;
            color: red;
            transition: 2s ease;
        }

        .product img{
            border-radius: 12px;
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product button{
            background-color: palevioletred;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
        }

        .product:hover{
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="parent">

        <div class="product">
            <img src="https://images.pexels.com/photos/12969102/pexels-photo-12969102.jpeg">
            <h2>Slippers</h2>
            <p><del>$15</del> <mark>$7</mark></p>
            <button>Add To Cart</button>
        </div>

                <div class="product">
            <img src="https://images.pexels.com/photos/11973853/pexels-photo-11973853.jpeg">
            <h2>Watch</h2>
            <p><del>$70.99</del> <mark>$40</mark></p>
            <button>Add To Cart</button>
        </div>

                <div class="product">
            <img src="https://images.pexels.com/photos/16304554/pexels-photo-16304554.jpeg">
            <h2>Bracelet</h2>
            <p><del>$49.99</del> <mark>$35</mark></p>
            <button>Add To Cart</button>
        </div>

                <div class="product">
            <img src="https://images.pexels.com/photos/15650568/pexels-photo-15650568.jpeg">
            <h2>Ring</h2>
            <p><del>$12</del> <mark>$6</mark></p>
            <button>Add To Cart</button>
        </div>

                <div class="product">
            <img src="https://images.pexels.com/photos/16124761/pexels-photo-16124761.jpeg">
            <h2>Silver Chain</h2>
            <p><del>$100</del> <mark>$70.99</mark></p>
            <button>Add To Cart</button>
        </div>

                <div class="product">
            <img src="https://images.pexels.com/photos/33611287/pexels-photo-33611287.jpeg">
            <h2>Cap</h2>
            <p><del>$15</del> <mark>$10</mark></p>
            <button>Add To Cart</button>
        </div>

    </div>
</body>
</html>
