<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            display: flex;
            justify-content: space-evenly;
            background-color: #f2f2f2;
            border: 1px solid black;
            gap: 30px;
            align-items: center;

            height: 40px;
        }
        .box{
            border: 1px solid black;
            width: 100px;
            height: 100px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-style: italic;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <!--flex gives display in 1 dimensional - either row or column -->
    <div class="product">
    <div class="box">Cake</div>
    <div class="box">Cookie</div>
    <div class="box">pastry</div>
    </div>
</body>
</html>
